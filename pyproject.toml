[project]
name = "drf-permission-rules"
version = "0.5.2"
description = "Declarative access policies/permissions modeled after AWS' IAM policies."
authors = [
    { name = "Pavel Maltsev", email = "pavel@speechki.org" },
    { name = "Bulat Kurbanov", email = "kurbanovbul@gmail.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["django", "restframework", "policy", "authorization", "declaritive"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
]
dependencies = [
    "django",
    "djangorestframework",
    "drf-access-policy",
    "redis",
    "django-model-utils",
    "django-json-widget",
    "drf-yasg[validation]",
]

[project.urls]
Homepage = "https://github.com/speechki-book/drf-permission-rules"

[dependency-groups]
dev = [
    "black>=26.5.1,<27",
    "isort>=9.0.1,<10",
    "pyproject-flake8>=7.0.0,<8",
    "lefthook>=2.1.12,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["permission_rules"]

[tool.hatch.build.targets.sdist]
exclude = ["tests*", ".memory"]


[tool.black]
line-length = 119
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | app/protobuf
  | setup.py
)/
'''

[tool.flake8]
ignore = [
    # Too many leading '#' for block comment ( https://www.flake8rules.com/rules/E266.html )
    "E266",
    # Whitespace before ':' ( https://www.flake8rules.com/rules/E203.html )
    "E203",
    # Line break occurred before a binary operator ( https://www.flake8rules.com/rules/W503.html )
    "W503",
]
max-line-length = 119
max-complexity = 15
select = "B,C,E,F,W,T4,B9"
exclude = [
    # No need to traverse our git directory
    ".git",
    # There's no value in checking cache directories
    "__pycache__",
    # The old directory contains Flake8 2.0
    "old",
    # This contains our built documentation
    "build",
    # This contains builds of flake8 that we don't want to check
    "dist",
    # django migrations
    "migrations",
    "setup.py"
]
# Module imported but unused ( https://www.flake8rules.com/rules/F401.html )
per-file-ignores = [
  "__init__.py:F401",
  "apps.py:F401"
]

[tool.isort]
profile = "black"
line_length = 119
only_sections = true
force_sort_within_sections = true
lines_after_imports = 2
lexicographical = true
sections = ["FUTURE", "STDLIB", "BASEFRAMEWORK", "FRAMEWORKEXT", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_baseframework = ["django"]
known_frameworkext = ["rest_framework"]
src_paths = ["permission_rules"]
skip_glob = ["setup.py"]
