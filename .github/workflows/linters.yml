name: Linters

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lefthook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 32

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip3 install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run Lefthook
        run: poetry run lefthook run pre-commit --all-files
